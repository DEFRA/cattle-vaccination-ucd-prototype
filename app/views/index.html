{% extends "layouts/main.html" %}

{% set pageName="Home" %}

{% block content %}
<style>
  /* Version option boxes. A light grey card per prototype version, with the
     version number as a tag in the top-right, a "Start" action and the
     what's-new links underneath. */
  .app-version-card {
    background: #f3f2f1;
    padding: 20px 25px 25px;
    margin-bottom: 20px;
    scroll-margin-top: 20px;
  }
  .app-version-card__header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 15px;
  }
  .app-version-card__header h3 { margin-bottom: 0; }
  .app-version-card__badge { flex-shrink: 0; }
  /* Keep the round / status tags on a single line. The tag component caps
     width at 160px, which clips longer labels, so lift the cap here. */
  .app-version-card .govuk-tag { white-space: nowrap; max-width: none; }
  .app-version-card__links { margin-bottom: 0; }
  .app-version-card__links li { margin-bottom: 4px; }
  .app-version-card__links li:last-child { margin-bottom: 0; }

  /* Left-hand anchor menu. Stacks above the content on small screens; on
     wider screens it follows the viewport as the vet scrolls the cards. */
  .app-side-nav { border-top: 2px solid #1d70b8; padding-top: 10px; }
  .app-side-nav__group { margin-bottom: 20px; }
  .app-side-nav__list li { margin-bottom: 8px; }
  .app-group-heading { scroll-margin-top: 20px; }
  @media (min-width: 48.0625em) {
    .app-side-nav { position: sticky; top: 20px; }
  }
</style>

<h1 class="govuk-heading-l">Cattle vaccination - bTB</h1>

<h2 class="govuk-heading-m">Usability testing - Nov 2026</h2>

<a href="vax/v1-6/1-cphtasklist1.html" role="button" draggable="false" class="govuk-button govuk-button--start" data-module="govuk-button">
  Start now
  <svg class="govuk-button__start-icon" xmlns="http://www.w3.org/2000/svg" width="17.5" height="19" viewBox="0 0 33 40" aria-hidden="true" focusable="false">
    <path fill="currentColor" d="M0 0h13l20 20-20 20H0l20-20z" />
  </svg>
</a>


<h2 class="govuk-heading-m">Previous design work</h2>
<p class="govuk-body">View iterations<a href="ee.html" class="govuk-link"> here</a> (Aug 2026).</p>



{% endblock %}
